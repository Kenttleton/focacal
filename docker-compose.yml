services:
  focacal:
    build: .
    container_name: focacal
    restart: unless-stopped

    # Publish all service ports.
    ports:
      - "${CALDAV_PORT:-5232}:5232"     # CalDAV — subscribe from Mac Calendar / Google Cal
      - "${REST_PORT:-5233}:5233"       # REST API — Raycast extension
      - "${MCP_PORT:-5234}:5234"        # MCP server — optional external clients
      - "${OAUTH_PORT:-8080}:8080"      # OAuth2 callback — used only during 'focacal auth'

    # Pass .env into the container (it is optional: without it the defaults
    # below apply). This is how ics_url_env feeds (FOCACAL_ICS_*), the agent
    # key (FOCACAL_AGENT_API_KEY) and other FOCACAL_<SECTION>_<KEY>
    # overrides reach focacal. Entries under environment: take precedence;
    # they read the same .env values, so the two agree.
    env_file:
      - path: .env
        required: false

    environment:
      # Core
      FOCACAL_DEBUG: "${FOCACAL_DEBUG:-false}"

      # OAuth redirect base — set this to your public domain if deployed.
      # For local use: http://localhost:8080 (the default)
      OAUTH_REDIRECT_BASE_URL: "${OAUTH_REDIRECT_BASE_URL:-http://localhost:8080}"

      # Scheduler agent endpoint (OpenAI-compatible; note the /v1 suffix).
      # Overrides agent.base_url in config/planner.yaml.
      FOCACAL_AGENT_BASE_URL: "${FOCACAL_AGENT_BASE_URL:-http://host.docker.internal:11434/v1}"

      # Google OAuth credentials (required if you have a google source).
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"

      # Microsoft/Outlook OAuth credentials (required if you have an outlook source).
      OUTLOOK_CLIENT_ID: "${OUTLOOK_CLIENT_ID:-}"
      OUTLOOK_CLIENT_SECRET: "${OUTLOOK_CLIENT_SECRET:-}"

    volumes:
      # Persistent data: SQLite DB (rebuildable state only), recovery key.
      - focacal-data:/data
      # Config directory: config.yaml, planner.yaml, calendars.yaml and the
      # local-only credentials.yaml. Writable so the UI can save settings;
      # edits apply live except the server: block. See docs/config-domains.md.
      # On Linux the directory must be writable by uid 1001 (the container user).
      - ./config:/data/config

    # Allows Ollama running on the host (not in Docker) to be reachable
    # via host.docker.internal on both Mac and Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  focacal-data:
    name: focacal-data
