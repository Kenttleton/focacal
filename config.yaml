# focacal configuration
# Place this file at ./config.yaml next to docker-compose.yml
# It is mounted into the container at /data/config.yaml (read-only).
#
# Sensitive values (OAuth credentials, Ollama URL) belong in .env, not here.
# This file is safe to commit to version control.

working_hours:
  start: "09:00"
  end: "18:00"
  timezone: "America/New_York"   # IANA timezone name

lunch:
  preferred: "12:00"             # ideal lunch start time
  window_start: "11:30"         # earliest acceptable lunch start
  window_end: "13:30"           # latest acceptable lunch start
  duration_minutes: 60

focus:
  # Style options:
  #   flexible  — AI fills gaps intelligently, varying block lengths
  #   pomodoro  — 25-min work blocks with 5-min breaks
  #   fixed     — blocks of exactly max_block_minutes
  style: "flexible"
  min_block_minutes: 30          # ignore gaps shorter than this
  max_block_minutes: 120         # split longer gaps at this boundary
  buffer_around_meetings: 10     # minutes of buffer before/after meetings

ollama:
  # base_url and model are also configurable via OLLAMA_BASE_URL / OLLAMA_MODEL env vars.
  base_url: "http://host.docker.internal:11434"
  model: "qwen2.5:14b"
  context_window: 32768          # larger context = better multi-day reasoning
  timeout_secs: 120

# Calendar sources — add one entry per Google or Outlook account.
sources:
  - id: "work-google"            # unique slug
    type: "google"
    calendar_ids: []             # empty = primary calendar only

  # - id: "personal-outlook"
  #   type: "outlook"
  #   calendar_ids: []

# Internal server ports — these are container-internal ports.
# To change the HOST port, set CALDAV_PORT / REST_PORT / MCP_PORT in .env.
server:
  caldav_port: 5232
  rest_port: 5233
  mcp_port: 5234
  oauth_port: 8080
  bind_address: "0.0.0.0"
  webhooks_enabled: false        # polling every 5 minutes covers it

oauth:
  # Also configurable via OAUTH_REDIRECT_BASE_URL env var.
  redirect_base_url: "http://localhost:8080"
