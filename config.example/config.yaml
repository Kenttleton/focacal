# focacal App settings: servers and the auth switch.
#
# This directory (config/) is the whole portable configuration:
#   config.yaml     App (this file)
#   planner.yaml    Planner: working hours, lunch, focus, scheduler agent, colors
#   calendars.yaml  Calendars: accounts, calendars, destinations, OAuth redirect
#   credentials.yaml  login (local only, gitignored, created by /auth/setup)
# docker-compose.yml mounts it at /data/config. See docs/config-domains.md.
# Edits apply live within about a second, except the server: block below,
# which needs a restart. Saving from the UI rewrites this file without comments.
#
# Secrets (OAuth client secrets, agent api_key, ICS feed URLs) belong in .env,
# not here; docker-compose.yml passes .env into the container. Every value
# below is overridable with FOCACAL_<SECTION>_<KEY>.

# Internal server ports — these are container-internal ports.
# To change the HOST port, set CALDAV_PORT / REST_PORT / MCP_PORT in .env.
server:
  caldav_port: 5232
  rest_port: 5233
  mcp_port: 5234
  oauth_port: 8080
  bind_address: "0.0.0.0"
  webhooks_enabled: false # polling every 5 minutes covers it

# Login credentials are not stored here: first run opens /auth/setup, which
# writes credentials.yaml in this directory.
auth:
  enabled: true
